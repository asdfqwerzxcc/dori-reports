<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TwinOps 디자인 덱</title>
<style>
  :root{
    --canvas:#0c0c0d; --s2:#1c1c1f; --line:#2c2c2c;
    --text:#e7eaed; --dim:#8a929b; --faint:#6b7280; --accent:#3b82f6;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
    --sans:"Noto Sans KR","Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--canvas);color:var(--text);font-family:var(--sans);overscroll-behavior:none}
  .deck{display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .deck::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100vw;height:100dvh;scroll-snap-align:center;display:flex;flex-direction:column;padding:14px 12px 24px;gap:8px}
  .top{display:flex;align-items:baseline;gap:8px}
  .top h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .top .n{font:10px var(--mono);color:var(--faint);letter-spacing:.08em}
  .top .badge{margin-left:auto;font:9.5px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
  .shot{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111112;background-repeat:no-repeat;background-size:300% auto;background-position:var(--pos,50%) center}
  .cap{font-size:11.5px;color:var(--dim);line-height:1.5}
  .cap b{color:var(--text);font-weight:500}
  .pager{position:fixed;bottom:7px;left:0;right:0;display:flex;justify-content:center;gap:4px;pointer-events:none;flex-wrap:wrap;padding:0 12px}
  .pager i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.20)}
  .pager i.on{background:var(--accent)}
  .hint{position:fixed;top:6px;right:12px;font:9.5px var(--mono);color:var(--faint)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="pager" id="pager"></div>
<div class="hint">swipe · 탭 확대</div>
<script>
  const screens = [
    { file: "ed-evolved.png", title: "에디터 메인", tag: "D · dark console", note: "파스칼 구조 유지 — 56px 레일, 사이트 트리, 뷰바, 떠 있는 툴, 우측 인스펙터(바인딩·변환·속성)." },
    { file: "ed-project.png", title: "프로젝트 리스트", tag: "editor home", note: "카드 썸네일 + KPI 스트립, 하단 최근 씬과 작업 공간 요약." },
    { file: "ed-scenes.png", title: "씬 리스트", tag: "project > scenes", note: "영역별 그룹, 상태 점·알람 수·마지막 편집, 우측 선택 씬 미리보기." },
    { file: "ed-tagbinding.png", title: "태그 바인딩", tag: "binding", note: "연결/지연/미바인딩을 행 단위로, 우측 라이브 미리보기와 자동 매핑." },
    { file: "rt-overview.png", title: "런타임 개요", tag: "operator", note: "뷰포트 + KPI + 알람 요약 + 설비 상태. 숫자는 크게, 상태는 점·도형으로." },
    { file: "rt-alarms.png", title: "알람 콘솔", tag: "alarms", note: "심각도 ◆▲● + 텍스트, 미확인/확인, 우측 타임라인·관련 태그·조치." },
  ];
  const slices = [
    { pos: "0%", label: "좌측 패널" },
    { pos: "50%", label: "가운데" },
    { pos: "100%", label: "우측 패널" },
  ];

  const deck = document.getElementById("deck");
  const pager = document.getElementById("pager");
  let index = 0;

  for (const s of screens) {
    for (const sl of slices) {
      const sec = document.createElement("section");
      sec.className = "slide";
      sec.innerHTML = `
        <div class="top"><span class="n">${String(index + 1).padStart(2, "0")}</span><h2>${s.title}</h2><span class="badge">${s.tag} · ${sl.label}</span></div>
        <div class="shot" style="background-image:url('${s.file}');--pos:${sl.pos}"></div>
        <div class="cap"><b>${sl.label}</b> — ${s.note}</div>`;
      deck.appendChild(sec);
      const dot = document.createElement("i");
      if (index === 0) dot.className = "on";
      pager.appendChild(dot);
      index++;
    }
  }

  const dots = [...pager.children];
  deck.addEventListener("scroll", () => {
    const i = Math.round(deck.scrollLeft / window.innerWidth);
    dots.forEach((d, j) => { d.className = j === i ? "on" : ""; });
  }, { passive: true });

  deck.addEventListener("click", (e) => {
    const shot = e.target.closest(".shot");
    if (!shot) return;
    const url = shot.style.backgroundImage.match(/url\("?([^")]+)"?\)/)[1];
    window.open(url, "_blank");
  });
</script>
</body>
</html>
