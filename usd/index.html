<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>usd-web-viewer test</title>
<style>
  html,body{margin:0;height:100%;background:#0c0c0d;color:#e7eaed;font:13px "Noto Sans KR",system-ui}
  #viewer{position:absolute;inset:0}
  .hud{position:absolute;left:14px;top:12px;font:11px ui-monospace,monospace;color:#8a929b;z-index:2}
  .hud b{color:#e7eaed;font-weight:500}
</style>
</head>
<body>
<div id="viewer"></div>
<div class="hud"><b>USD web viewer</b> · Robotiq 2F-85 (SimReady)</div>
<script>
  window.addEventListener("error", (e) => { document.body.setAttribute("data-error", String(e.message || e.error)); });
  window.addEventListener("unhandledrejection", (e) => { document.body.setAttribute("data-error", "rejection:" + String(e.reason)); });
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
